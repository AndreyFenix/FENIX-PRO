name: Build and test FENIX PRO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Skip until the complete source tree has been copied to the repository root.
    if: ${{ hashFiles('src/FENIX.App/FENIX.App.csproj') != '' }}
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and compile WPF application
        run: dotnet build src/FENIX.App/FENIX.App.csproj --configuration Release
